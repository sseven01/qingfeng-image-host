version: '3.8'

services:
  qingfeng-image-host:
    build: .
    container_name: qingfeng-image-host
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 只挂一个主文件夹，程序自动在其中使用三个子目录：
      #   uploads、data、thumbs（检测到 /app/storage 挂载点即启用）
      # 主文件夹由 QF_ROOT 指定（.env 或环境变量），默认当前目录
      - ${QF_ROOT:-.}:/app/storage
    environment:
      - PORT=3000
      # 以下全部可选：留空即由 CLI / 后台设置写入 data/config.json（环境变量优先）
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - BASE_URL=${BASE_URL:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_WRITE=${API_TOKEN_WRITE:-}
