version: '3.8'

services:
  qingfeng-image-host:
    build: .
    container_name: qingfeng-image-host
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./thumbs:/app/thumbs
    environment:
      - PORT=3000
      # 以下全部可选：留空即由 CLI / 后台设置写入 data/config.json（环境变量优先）
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - BASE_URL=${BASE_URL:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_WRITE=${API_TOKEN_WRITE:-}
