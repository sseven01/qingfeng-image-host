version: '3.8'

services:
  qingfeng-image-host:
    build: .
    container_name: qingfeng-image-host
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 总路径由 QF_ROOT 指定（.env 或环境变量），三个子目录自动拼接：
      #   QF_ROOT=/data/img  →  /data/img/uploads、/data/img/data、/data/img/thumbs
      # 不设置时默认当前目录（./uploads、./data、./thumbs）
      - ${QF_ROOT:-.}/uploads:/app/uploads
      - ${QF_ROOT:-.}/data:/app/data
      - ${QF_ROOT:-.}/thumbs:/app/thumbs
    environment:
      - PORT=3000
      # 以下全部可选：留空即由 CLI / 后台设置写入 data/config.json（环境变量优先）
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - BASE_URL=${BASE_URL:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_WRITE=${API_TOKEN_WRITE:-}
